<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión — AuthFlow</title>
  <meta name="description" content="Accede a tu cuenta AuthFlow de forma segura." />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="page-wrapper">
    <div class="card">

      <!-- Brand -->
      <div class="brand">
        <div class="brand-logo">
          <span class="brand-main">Auth</span><span class="brand-accent">Flow</span>
        </div>
        <div class="brand-subtitle">Sistema de autenticación seguro</div>
      </div>

      <h1 class="card-title">Iniciar Sesión</h1>
      <p class="card-description">Introduce tus credenciales para acceder</p>

      <!-- Alert container -->
      <div id="alert-box"></div>

      <!-- Form -->
      <form id="login-form" novalidate autocomplete="on">

        <div class="form-group">
          <label class="form-label" for="email">Correo Electrónico</label>
          <input
            class="form-input"
            type="email"
            id="email"
            name="email"
            placeholder="ejemplo@correo.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <div class="input-wrapper">
            <input
              class="form-input"
              type="password"
              id="password"
              name="password"
              placeholder="Tu contraseña"
              autocomplete="current-password"
              required
            />
            <button type="button" class="toggle-password" id="toggle-pass" aria-label="Mostrar/ocultar contraseña">
              👁
            </button>
          </div>
        </div>

        <div class="forgot-link">
          <a href="forgot.html">¿Olvidaste tu usuario o contraseña?</a>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">
          Entrar
        </button>

      </form>

      <div class="form-footer">
        ¿No tienes cuenta? <a href="register.html">Regístrate</a>
      </div>

    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
